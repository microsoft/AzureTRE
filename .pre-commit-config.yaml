---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17 # keep in sync with Super-Linter and requirements.txt
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      # Exclusions are defined once in pyproject.toml so CI and pre-commit scan the same files
      - id: bandit
        args: [-ll, --configfile, pyproject.toml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.97.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.github/linters/.tflint.hcl]
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
          # Module sources are raw git URLs that fail Markdown bare-URL linting
          - --args=--hide=modules

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.5.0
    hooks:
      - id: prettier
        files: ^ui/app/
