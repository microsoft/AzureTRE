---
name: VM Size Availability

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      region:
        description: >-
          Region: the Azure region to check. ci-location is the LOCATION variable of the CICD environment.
          Select none to check only the regions in More regions.
        type: choice
        default: ci-location
        options:
          - ci-location
          - switzerlandnorth
          - switzerlandwest
          - uksouth
          - ukwest
          - westeurope
          - northeurope
          - swedencentral
          - norwayeast
          - germanywestcentral
          - francecentral
          - italynorth
          - polandcentral
          - spaincentral
          - eastus
          - eastus2
          - centralus
          - westus2
          - westus3
          - canadacentral
          - australiaeast
          - japaneast
          - southeastasia
          - centralindia
          - southafricanorth
          - brazilsouth
          - uaenorth
          - none
      more_regions:
        description: "More regions: other Azure regions to check, separated by commas. For example uksouth,eastus2"
        type: string
        required: false
        default: ""
  # A push to a branch checks the LOCATION region of CICD. A manual run covers main.
  # There is no pull_request trigger, so a pull request never starts the workflow.
  push:
    branches-ignore:
      - main
    paths:
      # The files that set VM sizes in code.
      - "templates/**/porter.yaml"
      - "templates/**/template_schema.json"
      - "templates/**/*.tf"
      - "core/terraform/**"
      - "config_schema.json"
      - ".github/actions/devcontainer_run_command/action.yml"
      # The files of the report.
      - "devops/scripts/vm_size_report.py"
      - "devops/scripts/vm_size_catalogue.txt"
      - ".github/workflows/vm_size_report.yml"

# A new push stops the older push run on the same branch.
# Each manual run has its own group, so another run does not stop it.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Report VM size availability
    # Dependabot runs get no environment secrets, so they cannot log in to Azure.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    # The federated credential of the CI identity trusts this environment.
    environment: CICD
    timeout-minutes: 15
    permissions:
      contents: read
      # Log in to Azure with OIDC.
      id-token: write
    steps:
      # A fork without the CICD secrets cannot log in to Azure. A push run then skips the report.
      - name: Check the Azure credentials
        id: credentials
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "::notice::The CICD environment has no AZURE_CLIENT_ID secret, so the push run skips the report."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The CICD environment has no AZURE_CLIENT_ID secret. Add the secret, then run the workflow again."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Azure Login
        if: steps.credentials.outputs.ready == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT || secrets.AZURE_ENVIRONMENT || 'AzureCloud' }}

      - name: Report VM size availability
        if: steps.credentials.outputs.ready == 'true'
        env:
          # A push has no inputs, so it uses ci-location.
          REGION: ${{ inputs.region || 'ci-location' }}
          MORE_REGIONS: ${{ inputs.more_regions }}
          CI_LOCATION: ${{ vars.LOCATION }}
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          case "$REGION" in
            none) regions="$MORE_REGIONS" ;;
            ci-location)
              if [ -z "$CI_LOCATION" ]; then
                echo "::error::The CICD environment has no LOCATION variable. Select a region."
                exit 1
              fi
              regions="$CI_LOCATION,$MORE_REGIONS"
              ;;
            *) regions="$REGION,$MORE_REGIONS" ;;
          esac
          if [ -z "${regions//[, ]/}" ]; then
            echo "::error::Select a region, or type one or more regions in More regions."
            exit 1
          fi
          # The artifact is public on a public repository, so keep subscription data out of the report.
          python3 devops/scripts/vm_size_report.py --region "$regions" --hide-subscription \
            --link-base "$LINK_BASE" --output vm-size-report.md
          cat vm-size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vm-size-report
          path: vm-size-report.md
          if-no-files-found: error
          retention-days: 7
