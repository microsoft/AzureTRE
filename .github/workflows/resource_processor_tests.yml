---
name: Resource Processor Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - "feature/**"
    paths:
      - 'resource_processor/**'
      - 'templates/shared_services/firewall/**'
      - '.github/workflows/resource_processor_tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test Resource Processor and Porter compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r resource_processor/tests_rp/requirements.txt
      - name: Install pinned Porter executable
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output porter \
            https://github.com/getporter/porter/releases/download/v1.4.0/porter-linux-amd64
          echo '6bfb2ebe1c14ab008030d9e510a6087ae141b2d0848efd318fbe56d5ca3df5ed  porter' | sha256sum --check
          chmod +x porter
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run unit and Porter compatibility tests
        env:
          PYTHONPATH: resource_processor
          PORTER_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/porter
          PORTER_TEST_CONTAINERS: '1'
        run: >-
          python -m pytest resource_processor/tests_rp resource_processor/tests_porter
          -q -o asyncio_default_fixture_loop_scope=function
