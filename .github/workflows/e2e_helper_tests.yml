---
name: E2E Helper Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - "feature/**"
    paths:
      - 'e2e_tests/**'
      - '.github/workflows/e2e_helper_tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test E2E helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r e2e_tests/unit_tests/requirements.txt
      - name: Test token renewal and operation polling
        env:
          PYTHONPATH: .:e2e_tests
        run: python -m unittest discover -s e2e_tests/unit_tests -v
