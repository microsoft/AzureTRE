---
name: pr_comment_bot

on: # yamllint disable-line rule:truthy
  issue_comment:
    types: [created] # only run on new comments
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#issue_comment
    # https://docs.github.com/en/developers/webhooks-and-events/webhooks/webhook-events-and-payloads#issue_comment

permissions:
  contents: read

jobs:
  pr_comment:
    name: PR comment
    # https://docs.github.com/en/graphql/reference/enums#commentauthorassociation
    # (and https://docs.github.com/en/rest/reference/issues#comments)

    # only allow commands where:
    # - the comment is on a PR
    # - the commenting user has write permissions (i.e. is OWNER or COLLABORATOR)
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      checks: write
      contents: read
    outputs:
      command: ${{ steps.check_command.outputs.command }}
      prRef: ${{ steps.check_command.outputs.prRef }}
      prHeadSha: ${{ steps.check_command.outputs.prHeadSha }}
      prRefId: ${{ steps.check_command.outputs.prRefId }}
      branchRefId: ${{ steps.check_command.outputs.branchRefId }}
      branchCiGitRef: ${{ steps.check_command.outputs.branchCiGitRef }}
      ciGitRef: ${{ steps.check_command.outputs.ciGitRef }}
      skipDeployment: ${{ steps.check_command.outputs.skipDeployment }}
      acceptNexusEula: ${{ steps.check_command.outputs.acceptNexusEula }}
    steps:
      # Ensure we have the script file for the github-script action to use
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Determine whether the comment is a command
      - id: check_command
        name: Check for a command using GitHub script
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const script = require('./.github/scripts/build.js')
            await script.getCommandFromComment({core, context, github});

      - name: Output PR details
        run: |
          echo "PR Details"
          echo "=========="
          echo "prRef       : ${{ steps.check_command.outputs.prRef }}"
          echo "prHeadSha   : ${{ steps.check_command.outputs.prHeadSha }}"
          echo "legacyPrId  : ${{ steps.check_command.outputs.prRefId }}"
          echo "ciGitRef    : ${{ steps.check_command.outputs.ciGitRef }}"
          echo "legacyBranchId : ${{ steps.check_command.outputs.branchRefId }}"
          echo "skipDeploy  : ${{ steps.check_command.outputs.skipDeployment }}"

      # If we don't run the actual deploy (see the run_test job below) we won't receive a check-run status,
      # and will have to send it "manually"
      - name: Bypass E2E check-runs status
        if: ${{ steps.check_command.outputs.command == 'test-force-approve' }}
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # the name must be identical to the one received by the real job
          sha: ${{ steps.check_command.outputs.prHeadSha }}
          name: "Deploy PR / Run E2E Tests (Smoke)"
          status: "completed"
          conclusion: "success"

  destroy_pr_env:
    needs: [pr_comment]
    if: ${{ needs.pr_comment.outputs.command == 'test-destroy-env' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment: CICD
    name: Destroy PR env
    concurrency:
      group: deploy-${{ needs.pr_comment.outputs.ciGitRef }}
      cancel-in-progress: false
      queue: max
    steps:
      # Ensure we have the script files
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Perform az login for destroy env script to be able to run
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ (vars.AZURE_ENVIRONMENT != '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}

      - name: Run deployment cleanup
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.event.repository.full_name }}
          CI_GIT_REF: ${{ needs.pr_comment.outputs.ciGitRef }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_KEYVAULT_DEBUG_ON_DESTROY: ${{ secrets.SHOW_KEYVAULT_DEBUG_ON_DESTROY }}
        run: |
          set -e
          gh pr comment "${PR_NUMBER}" --repo "$REPO" --body "Destroying PR test environments for ${CI_GIT_REF}... (run: https://github.com/${REPO}/actions/runs/${RUN_ID})"
          python3 devops/scripts/destroy_ci_ref_env.py --ref "$CI_GIT_REF" --subscription "$AZURE_SUBSCRIPTION_ID"
          gh pr comment "${PR_NUMBER}" --repo "$REPO" --body "PR test environment destroy complete for ${CI_GIT_REF}"

  destroy_branch_env:
    needs: [pr_comment]
    if: ${{ needs.pr_comment.outputs.command == 'test-destroy-env' && needs.pr_comment.outputs.branchCiGitRef != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment: CICD
    name: Destroy branch env
    concurrency:
      group: deploy-${{ needs.pr_comment.outputs.branchCiGitRef }}
      cancel-in-progress: false
      queue: max
    steps:
      # Ensure we have the script files
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Perform az login for destroy env script to be able to run
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ (vars.AZURE_ENVIRONMENT != '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}

      - name: Run deployment cleanup
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.event.repository.full_name }}
          CI_GIT_REF: ${{ needs.pr_comment.outputs.branchCiGitRef }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_KEYVAULT_DEBUG_ON_DESTROY: ${{ secrets.SHOW_KEYVAULT_DEBUG_ON_DESTROY }}
        run: |
          set -e
          gh pr comment "${PR_NUMBER}" --repo "$REPO" --body "Destroying branch test environments for ${CI_GIT_REF}... (run: https://github.com/${REPO}/actions/runs/${RUN_ID})"
          python3 devops/scripts/destroy_ci_ref_env.py --ref "$CI_GIT_REF" --subscription "$AZURE_SUBSCRIPTION_ID"
          gh pr comment "${PR_NUMBER}" --repo "$REPO" --body "Branch test environment destroy complete for ${CI_GIT_REF}"

  prepare_pr_env:
    name: Prepare PR environment
    needs: [pr_comment]
    if: ${{ startsWith(needs.pr_comment.outputs.command, 'run-tests') }}
    runs-on: ubuntu-latest
    environment: CICD
    outputs:
      refid: ${{ steps.environment-id.outputs.refid }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Derive CI environment ID
        id: environment-id
        env:
          CI_GIT_REF: ${{ needs.pr_comment.outputs.ciGitRef }}
          CI_LOCATION: ${{ vars.LOCATION }}
          CI_AZURE_ENVIRONMENT: ${{ vars.AZURE_ENVIRONMENT || 'AzureCloud' }}
        run: |
          set -euo pipefail
          refid=$(python3 devops/scripts/ci_environment_id.py \
            --ref "$CI_GIT_REF" --location "$CI_LOCATION" --cloud "$CI_AZURE_ENVIRONMENT")
          echo "CI environment tre${refid} in ${CI_LOCATION} (${CI_AZURE_ENVIRONMENT})"
          echo "refid=$refid" >> "$GITHUB_OUTPUT"

  run_test:
    # Run the tests with the re-usable workflow
    needs: [pr_comment, prepare_pr_env]
    if: |
      needs.pr_comment.outputs.command == 'run-tests' ||
      needs.pr_comment.outputs.command == 'run-tests-extended' ||
      needs.pr_comment.outputs.command == 'run-tests-extended-aad' ||
      needs.pr_comment.outputs.command == 'run-tests-shared-services' ||
      needs.pr_comment.outputs.command == 'run-tests-backups' ||
      needs.pr_comment.outputs.command == 'run-tests-airlock'
    name: Deploy PR
    uses: ./.github/workflows/deploy_tre_reusable.yml
    permissions:
      id-token: write
      checks: write
      contents: read
      pull-requests: write
      actions: read # Required by the reusable management job
    with:
      prRef: ${{ needs.pr_comment.outputs.prRef }}
      prHeadSha: ${{ needs.pr_comment.outputs.prHeadSha }}
      ciGitRef: ${{ needs.pr_comment.outputs.ciGitRef }}
      ciEnvironmentId: ${{ needs.prepare_pr_env.outputs.refid }}
      e2eTestsCustomSelector: >-
        ${{ (needs.pr_comment.outputs.command == 'run-tests-extended' && 'extended') ||
        (needs.pr_comment.outputs.command == 'run-tests-extended-aad' && 'extended_aad') ||
        (needs.pr_comment.outputs.command == 'run-tests-shared-services' && 'shared_services') ||
        (needs.pr_comment.outputs.command == 'run-tests-backups' && 'backups') ||
        (needs.pr_comment.outputs.command == 'run-tests-airlock' && 'airlock') ||
        (needs.pr_comment.outputs.command == 'run-tests' && '') }}
      environmentName: CICD
      E2E_TESTS_NUMBER_PROCESSES: 1
      DEVCONTAINER_TAG: ${{ needs.prepare_pr_env.outputs.refid }}
      # github-script outputs strings; compare explicitly before passing to the typed workflow input.
      skipDeployment: ${{ needs.pr_comment.outputs.skipDeployment == 'true' }}
      acceptNexusEula: ${{ needs.pr_comment.outputs.acceptNexusEula == 'true' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AAD_TENANT_ID: ${{ secrets.AAD_TENANT_ID }}
      ACR_NAME: ${{ format('tre{0}', needs.prepare_pr_env.outputs.refid) }}
      API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
      API_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET }}
      APPLICATION_ADMIN_CLIENT_ID: ${{ secrets.APPLICATION_ADMIN_CLIENT_ID }}
      APPLICATION_ADMIN_CLIENT_SECRET: ${{ secrets.APPLICATION_ADMIN_CLIENT_SECRET }}
      MGMT_RESOURCE_GROUP_NAME: ${{ format('rg-tre{0}-mgmt', needs.prepare_pr_env.outputs.refid) }}
      MGMT_STORAGE_ACCOUNT_NAME: ${{ format('tre{0}mgmt', needs.prepare_pr_env.outputs.refid) }}
      SWAGGER_UI_CLIENT_ID: ${{ secrets.SWAGGER_UI_CLIENT_ID }}
      TEST_APP_ID: ${{ secrets.TEST_APP_ID }}
      TEST_WORKSPACE_APP_ID: ${{ secrets.TEST_WORKSPACE_APP_ID }}
      TEST_WORKSPACE_APP_SECRET: "${{ secrets.TEST_WORKSPACE_APP_SECRET }}"
      TEST_ACCOUNT_CLIENT_ID: "${{ secrets.TEST_ACCOUNT_CLIENT_ID }}"
      TEST_ACCOUNT_CLIENT_SECRET: "${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}"
      TRE_ID: ${{ format('tre{0}', needs.prepare_pr_env.outputs.refid) }}
      CI_CACHE_ACR_NAME: ${{ secrets.ACR_NAME }}
      ENCRYPTION_KV_NAME: ${{ format('tre{0}mgmt', needs.prepare_pr_env.outputs.refid) }}
      PRIVATE_AGENT_SUBNET_ID: ${{ secrets.PRIVATE_AGENT_SUBNET_ID }}
