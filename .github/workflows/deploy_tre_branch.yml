---
name: Recover Airlock review workspace (#5183)

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      action:
        description: Inspect or delete the disabled review workspace from run 11059
        type: choice
        options: [inspect, delete]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-refs/pull/5165/merge
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: CICD
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate environment scope
        shell: bash
        run: |
          set -euo pipefail
          az group show --name rg-tre06624892 --output json > "$RUNNER_TEMP/airlock-core-group.json"
      - name: Inspect or recover the identified review workspace
        env:
          RECOVERY_ACTION: ${{ inputs.action }}
          AAD_TENANT_ID: ${{ secrets.AAD_TENANT_ID }}
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          TEST_ACCOUNT_CLIENT_ID: ${{ secrets.TEST_ACCOUNT_CLIENT_ID }}
          TEST_ACCOUNT_CLIENT_SECRET: ${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/recover_airlock_5183.py
      - name: Verify resource group removal
        if: inputs.action == 'delete'
        shell: bash
        run: |
          set -euo pipefail
          test "$(az group exists --name rg-tre06624892-ws-9e3b)" = false
