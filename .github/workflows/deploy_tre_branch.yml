---
name: Recover failed test workspace 5228

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      execute:
        description: Delete the verified orphan VM and retry workspace deletion
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: recovery-5228-tre0f5cf0be
  cancel-in-progress: false

jobs:
  recover:
    name: Check or recover the failed workspace
    runs-on: ubuntu-latest
    environment: CICD
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check or recover only the resources recorded in issue 5228
        env:
          EXECUTE_RECOVERY: ${{ inputs.execute }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AAD_TENANT_ID: ${{ secrets.AAD_TENANT_ID }}
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          TEST_ACCOUNT_CLIENT_ID: ${{ secrets.TEST_ACCOUNT_CLIENT_ID }}
          TEST_ACCOUNT_CLIENT_SECRET: ${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}
        run: python .github/scripts/recovery/recover_5228_workspace.py
