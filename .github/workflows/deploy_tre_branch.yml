---
name: Read Airlock certificate state

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-refs/heads/feature/v0.30.0/12-release-notes
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read certificate and Nexus state
    runs-on: ubuntu-latest
    environment: CICD
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Read certificate and Nexus metadata
        env:
          AAD_TENANT_ID: ${{ secrets.AAD_TENANT_ID }}
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          TEST_ACCOUNT_CLIENT_ID: ${{ secrets.TEST_ACCOUNT_CLIENT_ID }}
          TEST_ACCOUNT_CLIENT_SECRET: ${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}
        run: python .github/scripts/diagnostics/read_airlock_certificate.py
