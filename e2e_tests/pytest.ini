[pytest]
markers =
    sql_validation: Private SQL query and configuration upgrade lifecycle
    smoke: marks tests as smoke (run sometimes, relatively fast)
    extended: marks tests as extended (run less frequently, relatively slow)
    linux_vm: opt-in Guacamole Linux VM provisioning check requiring Nexus or explicit EULA consent to create it
    extended_aad
    shared_services
    backups: only backup related
    performance: marks tests for performance evaluation
    timeout: used to set test timeout with pytest-timeout
    airlock: only airlock related
    airlock_validation: draft-container deletion and review-VM flow, including Nexus prerequisites and cleanup
    workspace_services

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
