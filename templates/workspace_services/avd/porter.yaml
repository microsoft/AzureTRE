---
schemaVersion: 1.0.0
name: tre-service-avd
version: 0.6.2
description: "An Azure TRE service for Azure Virtual Desktop with personal or pooled host pools"
dockerfile: Dockerfile.tmpl
registry: azuretre

credentials:
  - name: auth_client_id
    env: AUTH_CLIENT_ID
  - name: auth_client_secret
    env: AUTH_CLIENT_SECRET
  - name: auth_tenant_id
    env: AUTH_TENANT_ID
  - name: azure_tenant_id
    env: ARM_TENANT_ID
  - name: azure_subscription_id
    env: ARM_SUBSCRIPTION_ID
  - name: azure_client_id
    env: ARM_CLIENT_ID
  - name: azure_client_secret
    env: ARM_CLIENT_SECRET

parameters:
  - name: workspace_id
    type: string
  - name: display_name
    type: string
    default: "Azure Virtual Desktop"
    description: "The workspace service display name"
  - name: workspace_display_name
    type: string
    default: ""
    description: "The parent TRE workspace display name, supplied by the deployment pipeline"
  - name: tre_id
    type: string
  - name: id
    type: string
    description: "Resource ID"
  - name: tfstate_resource_group_name
    type: string
    description: "Resource group containing the Terraform state storage account"
  - name: tfstate_storage_account_name
    type: string
    description: "The name of the Terraform state storage account"
  - name: tfstate_container_name
    env: tfstate_container_name
    type: string
    default: "tfstate"
    description: "The name of the Terraform state storage container"
  - name: arm_use_msi
    env: ARM_USE_MSI
    type: boolean
    default: true
    enum: [true]
    description: "AVD deployment requires the TRE resource processor managed identity."
  - name: arm_environment
    type: string
  - name: azure_environment
    type: string
    default: "AzureCloud"
    enum: ["AzureCloud"]
    description: "Used by Azure CLI to select the Azure cloud"
  - name: workspace_subscription_id
    type: string
    default: ""
  - name: host_pool_type
    type: string
    default: "Personal"
    description: "Host pool deployment model (Personal or Pooled)"
  - name: workspace_owners_group_id
    type: string
    description: "Object ID of the workspace owners security group"
  - name: workspace_researchers_group_id
    type: string
    description: "Object ID of the workspace researchers security group"
  - name: enable_sso_preconsent
    type: boolean
    default: false
    description: "Create a dynamic device group for optional SSO pre-consent. Requires licensed Entra features and Graph application/group write permissions."
  - name: maximum_sessions
    type: integer
    default: 10
    description: "Maximum concurrent sessions per pooled session host"
  - name: pooled_session_host_count
    type: integer
    default: 1
    description: "Number of multi-user session hosts to deploy for a pooled host pool"
  - name: pooled_vm_size
    type: string
    default: "Standard_D4s_v6"
    description: "Virtual machine size for pooled session hosts"
  - name: enable_clipboard
    type: boolean
    default: false
    description: "Enable clipboard redirection between session and client"
  - name: clipboard_transfer_direction
    type: string
    default: "disabled"
    description: "Direction of allowed clipboard transfers (disabled, client_to_session, session_to_client, both)"

outputs:
  - name: connection_uri
    type: string
    applyTo:
      - install
      - upgrade
  - name: hostpool_name
    type: string
    applyTo:
      - install
      - upgrade
  - name: workspace_address_spaces
    type: string
    applyTo:
      - install
      - upgrade

mixins:
  - terraform:
      clientVersion: 1.9.8
  - az:
      clientVersion: 2.67.0

install:
  - terraform:
      description: "Deploy Azure Virtual Desktop Service"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        display_name: ${ bundle.parameters.display_name }
        workspace_display_name: ${ bundle.parameters.workspace_display_name }
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        arm_environment: ${ bundle.parameters.arm_environment }
        azure_environment: ${ bundle.parameters.azure_environment }
        auth_client_id: ${ bundle.credentials.auth_client_id }
        auth_client_secret: ${ bundle.credentials.auth_client_secret }
        auth_tenant_id: ${ bundle.credentials.auth_tenant_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        host_pool_type: ${ bundle.parameters.host_pool_type }
        workspace_owners_group_id: ${ bundle.parameters.workspace_owners_group_id }
        workspace_researchers_group_id: ${ bundle.parameters.workspace_researchers_group_id }
        maximum_sessions: ${ bundle.parameters.maximum_sessions }
        pooled_session_host_count: ${ bundle.parameters.pooled_session_host_count }
        pooled_vm_size: ${ bundle.parameters.pooled_vm_size }
        enable_clipboard: ${ bundle.parameters.enable_clipboard }
        clipboard_transfer_direction: ${ bundle.parameters.clipboard_transfer_direction }
        enable_sso_preconsent: ${ bundle.parameters.enable_sso_preconsent }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: tre-service-avd-${ bundle.parameters.id }
      outputs:
        - name: connection_uri
        - name: hostpool_name
        - name: workspace_address_spaces

upgrade:
  - terraform:
      description: "Upgrade Azure Virtual Desktop Service"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        display_name: ${ bundle.parameters.display_name }
        workspace_display_name: ${ bundle.parameters.workspace_display_name }
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        arm_environment: ${ bundle.parameters.arm_environment }
        azure_environment: ${ bundle.parameters.azure_environment }
        auth_client_id: ${ bundle.credentials.auth_client_id }
        auth_client_secret: ${ bundle.credentials.auth_client_secret }
        auth_tenant_id: ${ bundle.credentials.auth_tenant_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        host_pool_type: ${ bundle.parameters.host_pool_type }
        workspace_owners_group_id: ${ bundle.parameters.workspace_owners_group_id }
        workspace_researchers_group_id: ${ bundle.parameters.workspace_researchers_group_id }
        maximum_sessions: ${ bundle.parameters.maximum_sessions }
        pooled_session_host_count: ${ bundle.parameters.pooled_session_host_count }
        pooled_vm_size: ${ bundle.parameters.pooled_vm_size }
        enable_clipboard: ${ bundle.parameters.enable_clipboard }
        clipboard_transfer_direction: ${ bundle.parameters.clipboard_transfer_direction }
        enable_sso_preconsent: ${ bundle.parameters.enable_sso_preconsent }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: tre-service-avd-${ bundle.parameters.id }
      outputs:
        - name: connection_uri
        - name: hostpool_name
        - name: workspace_address_spaces

uninstall:
  - terraform:
      description: "Delete the Azure Virtual Desktop Service"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        display_name: ${ bundle.parameters.display_name }
        workspace_display_name: ${ bundle.parameters.workspace_display_name }
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        arm_environment: ${ bundle.parameters.arm_environment }
        azure_environment: ${ bundle.parameters.azure_environment }
        auth_client_id: ${ bundle.credentials.auth_client_id }
        auth_client_secret: ${ bundle.credentials.auth_client_secret }
        auth_tenant_id: ${ bundle.credentials.auth_tenant_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        host_pool_type: ${ bundle.parameters.host_pool_type }
        workspace_owners_group_id: ${ bundle.parameters.workspace_owners_group_id }
        workspace_researchers_group_id: ${ bundle.parameters.workspace_researchers_group_id }
        maximum_sessions: ${ bundle.parameters.maximum_sessions }
        pooled_session_host_count: ${ bundle.parameters.pooled_session_host_count }
        pooled_vm_size: ${ bundle.parameters.pooled_vm_size }
        enable_clipboard: ${ bundle.parameters.enable_clipboard }
        clipboard_transfer_direction: ${ bundle.parameters.clipboard_transfer_direction }
        enable_sso_preconsent: ${ bundle.parameters.enable_sso_preconsent }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: tre-service-avd-${ bundle.parameters.id }
