---
schemaVersion: 1.0.0
name: tre-service-avd-sessionhost
version: 0.4.0
description: "An Azure TRE User Resource Template for Azure Virtual Desktop Personal Session Host (Windows)"
dockerfile: Dockerfile.tmpl
registry: azuretre

custom:
  # For information on vm_sizes and image_options, see documentation
  vm_sizes:
    "2 CPU | 8GB RAM": Standard_D2s_v6
    "4 CPU | 16GB RAM": Standard_D4s_v6
    "8 CPU | 32GB RAM": Standard_D8s_v6
    "16 CPU | 64GB RAM": Standard_D16s_v6
  image_options:
    "Windows 11 Multi-Session":
      source_image_reference:
        publisher: microsoftwindowsdesktop
        offer: windows-11
        sku: win11-24h2-avd
        version: latest
      secure_boot_enabled: true
      vtpm_enabled: true
    "Windows 11 Enterprise":
      source_image_reference:
        publisher: microsoftwindowsdesktop
        offer: windows-11
        sku: win11-24h2-ent
        version: latest
      secure_boot_enabled: true
      vtpm_enabled: true
    "Windows 11":
      source_image_reference:
        publisher: microsoftwindowsdesktop
        offer: windows-11
        sku: win11-24h2-pro
        version: latest
      secure_boot_enabled: true
      vtpm_enabled: true
    "Windows 10 Multi-Session":
      source_image_reference:
        publisher: MicrosoftWindowsDesktop
        offer: Windows-10
        sku: win10-22h2-avd-g2
        version: latest
      secure_boot_enabled: true
      vtpm_enabled: true

credentials:
  - name: auth_client_id
    env: AUTH_CLIENT_ID
  - name: auth_client_secret
    env: AUTH_CLIENT_SECRET
  - name: auth_tenant_id
    env: AUTH_TENANT_ID
  - name: azure_tenant_id
    env: ARM_TENANT_ID
  - name: azure_subscription_id
    env: ARM_SUBSCRIPTION_ID
  - name: azure_client_id
    env: ARM_CLIENT_ID
  - name: azure_client_secret
    env: ARM_CLIENT_SECRET

parameters:
  - name: workspace_id
    type: string
  - name: display_name
    type: string
    default: ""
    description: "The personal desktop display name; defaults to the VM hostname when omitted"
  - name: tre_id
    type: string
  - name: parent_service_id
    type: string
    description: "The ID of the parent AVD workspace service"
    env: PARENT_SERVICE_ID
  - name: id
    type: string
    description: "An Id for this installation"
  - name: azure_environment
    type: string
    default: "AzureCloud"
    enum: ["AzureCloud"]
    description: "Used by Azure CLI to set the Azure environment"
  - name: tfstate_resource_group_name
    type: string
    description: "Resource group containing the Terraform state storage account"
  - name: tfstate_storage_account_name
    type: string
    description: "The name of the Terraform state storage account"
  - name: tfstate_container_name
    env: tfstate_container_name
    type: string
    default: "tfstate"
    description: "The name of the Terraform state storage container"
  - name: arm_use_msi
    env: ARM_USE_MSI
    type: boolean
    default: true
    enum: [true]
    description: "AVD deployment requires the TRE resource processor managed identity."
  - name: os_image
    type: string
    default: "Windows 11 Multi-Session"
  - name: admin_username
    type: string
    default: ""
  - name: vm_size
    type: string
    default: "2 CPU | 8GB RAM"
  - name: shared_storage_access
    type: boolean
    default: false
    description: "Optional shared storage access; requires storage account keys. Leave disabled where keys are prohibited."
  - name: shared_storage_name
    type: string
    default: "vm-shared-storage"
  - name: owner_id
    type: string
  - name: arm_environment
    type: string
  - name: enable_shutdown_schedule
    type: boolean
    default: false
    description: "Enable automatic shutdown schedule for the VM"
  - name: shutdown_time
    default: "1800"
    type: string
    description: "Time of day to shutdown the VM (HHmm format)"
    pattern: "^([01]?[0-9]|2[0-3])[0-5][0-9]$"
  - name: shutdown_timezone
    type: string
    description: "Timezone for the shutdown schedule"
    default: "UTC"
  - name: workspace_subscription_id
    type: string
    default: ""

outputs:
  - name: ip
    type: string
    applyTo:
      - install
      - upgrade
  - name: hostname
    type: string
    applyTo:
      - install
      - upgrade
  - name: connection_uri
    type: string
    applyTo:
      - install
      - upgrade
  - name: azure_resource_id
    type: string
    applyTo:
      - install
      - start
      - stop

mixins:
  - terraform:
      clientVersion: 1.9.8
  - az:
      clientVersion: 2.67.0

install:
  - terraform:
      description: "Deploy AVD Personal Session Host (Windows VM)"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        display_name: ${ bundle.parameters.display_name }
        tre_id: ${ bundle.parameters.tre_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        parent_service_id: ${ bundle.parameters.parent_service_id }
        tre_resource_id: ${ bundle.parameters.id }
        image: ${ bundle.parameters.os_image }
        admin_username: ${ bundle.parameters.admin_username }
        vm_size: ${ bundle.parameters.vm_size }
        shared_storage_access: ${ bundle.parameters.shared_storage_access }
        shared_storage_name: ${ bundle.parameters.shared_storage_name }
        enable_shutdown_schedule: ${ bundle.parameters.enable_shutdown_schedule }
        shutdown_time: ${ bundle.parameters.shutdown_time }
        shutdown_timezone: ${ bundle.parameters.shutdown_timezone }
        owner_id: ${ bundle.parameters.owner_id }
        auth_client_id: ${ bundle.credentials.auth_client_id }
        auth_client_secret: ${ bundle.credentials.auth_client_secret }
        auth_tenant_id: ${ bundle.credentials.auth_tenant_id }
        azure_environment: ${ bundle.parameters.azure_environment }
        arm_environment: ${ bundle.parameters.arm_environment }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      outputs:
        - name: ip
        - name: hostname
        - name: connection_uri
        - name: azure_resource_id

upgrade:
  - terraform:
      description: "Update AVD Personal Session Host (Windows VM)"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        display_name: ${ bundle.parameters.display_name }
        tre_id: ${ bundle.parameters.tre_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        parent_service_id: ${ bundle.parameters.parent_service_id }
        tre_resource_id: ${ bundle.parameters.id }
        image: ${ bundle.parameters.os_image }
        admin_username: ${ bundle.parameters.admin_username }
        vm_size: ${ bundle.parameters.vm_size }
        shared_storage_access: ${ bundle.parameters.shared_storage_access }
        shared_storage_name: ${ bundle.parameters.shared_storage_name }
        enable_shutdown_schedule: ${ bundle.parameters.enable_shutdown_schedule }
        shutdown_time: ${ bundle.parameters.shutdown_time }
        shutdown_timezone: ${ bundle.parameters.shutdown_timezone }
        owner_id: ${ bundle.parameters.owner_id }
        auth_client_id: ${ bundle.credentials.auth_client_id }
        auth_client_secret: ${ bundle.credentials.auth_client_secret }
        auth_tenant_id: ${ bundle.credentials.auth_tenant_id }
        azure_environment: ${ bundle.parameters.azure_environment }
        arm_environment: ${ bundle.parameters.arm_environment }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      outputs:
        - name: ip
        - name: hostname
        - name: connection_uri
        - name: azure_resource_id

uninstall:
  - terraform:
      description: "Delete the AVD Personal Session Host"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        display_name: ${ bundle.parameters.display_name }
        tre_id: ${ bundle.parameters.tre_id }
        workspace_subscription_id: ${ bundle.parameters.workspace_subscription_id }
        parent_service_id: ${ bundle.parameters.parent_service_id }
        tre_resource_id: ${ bundle.parameters.id }
        image: ${ bundle.parameters.os_image }
        admin_username: ${ bundle.parameters.admin_username }
        vm_size: ${ bundle.parameters.vm_size }
        shared_storage_access: ${ bundle.parameters.shared_storage_access }
        shared_storage_name: ${ bundle.parameters.shared_storage_name }
        enable_shutdown_schedule: ${ bundle.parameters.enable_shutdown_schedule }
        shutdown_time: ${ bundle.parameters.shutdown_time }
        shutdown_timezone: ${ bundle.parameters.shutdown_timezone }
        owner_id: ${ bundle.parameters.owner_id }
        auth_client_id: ${ bundle.credentials.auth_client_id }
        auth_client_secret: ${ bundle.credentials.auth_client_secret }
        auth_tenant_id: ${ bundle.credentials.auth_tenant_id }
        azure_environment: ${ bundle.parameters.azure_environment }
        arm_environment: ${ bundle.parameters.arm_environment }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }

start:
  - terraform:
      arguments:
        - "output"
      description: "Get resource ID from Terraform outputs"
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      outputs:
        - name: azure_resource_id
  - az:
      description: "Set Azure Cloud Environment"
      arguments:
        - cloud
        - set
      flags:
        name: ${ bundle.parameters.azure_environment }
  - az:
      description: "Login to Azure"
      arguments:
        - login
      flags:
        identity:
        username: ${ bundle.credentials.azure_client_id }
  - az:
      description: "Start the VM"
      arguments:
        - vm
        - start
      flags:
        ids: ${ bundle.outputs.azure_resource_id }

stop:
  - terraform:
      arguments:
        - "output"
      description: "Get VM resource ID from Terraform outputs"
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      outputs:
        - name: azure_resource_id
  - az:
      description: "Set Azure Cloud Environment"
      arguments:
        - cloud
        - set
      flags:
        name: ${ bundle.parameters.azure_environment }
  - az:
      description: "Login to Azure"
      arguments:
        - login
      flags:
        identity:
        username: ${ bundle.credentials.azure_client_id }
  - az:
      description: "Stop the VM"
      arguments:
        - vm
        - deallocate
      flags:
        ids: ${ bundle.outputs.azure_resource_id }
